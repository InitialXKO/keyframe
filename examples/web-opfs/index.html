<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OPFS Big Data Loading & Streaming Bake Demo</title>
  <style>
    body { margin: 20px; font-family: sans-serif; background: #222; color: #fff; }
    #log { background: #111; padding: 10px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
    progress { width: 100%; height: 20px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>OPFS Big Data Loading & Streaming Bake</h1>
  <progress id="bakeProgress" value="0" max="100"></progress>
  <div id="log">Initializing OPFS Storage Adapter...</div>
  <script type="module">
    import { Engine, Clip, Instance, Keyframe, StorageAdapter } from '../../dist/index.js';

    const logDiv = document.getElementById('log');
    const progressBar = document.getElementById('bakeProgress');
    function log(msg) { logDiv.innerText += '\n' + msg; }

    const adapter = new StorageAdapter();
    const engine = new Engine();

    log('Building 10,000 instance project IR...');
    const clip = new Clip('big_clip').duration(10000).addKeyframe(new Keyframe(0)).addKeyframe(new Keyframe(10000));
    engine.addClip(clip);

    const instances = [];
    for (let i = 0; i < 10000; i++) {
      instances.push(new Instance('big_clip', `large_inst_${i}`));
    }
    engine.addInstances(instances);

    const ir = engine.exportIR();
    log('Saving IR to OPFS (or memory fallback)...');
    await adapter.saveIR('project_10k.json', ir);

    log('Loading IR back from storage...');
    const loadedIR = await adapter.loadIR('project_10k.json');
    log(`Successfully loaded project IR with ${loadedIR.instances.length} instances!`);

    log('Starting "Bake as you go" Streaming Bake to OPFS (0ms to 10000ms in 1000ms chunks)...');
    await adapter.bakeStreamToOPFS(engine, 'long_animation_stream.bin', {
      startMs: 0,
      endMs: 10000,
      fps: 60,
      chunkSizeMs: 1000,
      onProgress: (percent) => {
        progressBar.value = percent;
        log(`Streaming bake progress: ${percent}%`);
      }
    });

    const bakedBytes = await adapter.loadBakeData('long_animation_stream.bin');
    log(`Streaming bake completed! Total OPFS binary file size: ${bakedBytes.byteLength} bytes.`);
  </script>
</body>
</html>
