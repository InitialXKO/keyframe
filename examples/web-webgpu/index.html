<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebGPU / Auto Fallback Particle System</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; }
    canvas { width: 800px; height: 600px; border: 1px solid #333; margin-top: 20px; }
    #status { color: #2196f3; font-weight: bold; }
  </style>
</head>
<body>
  <h1>WebGPU / Auto Fallback Renderer</h1>
  <p id="status">Initializing Renderer...</p>
  <canvas id="gpuCanvas" width="800" height="600"></canvas>
  <script type="module">
    import { Engine, Clip, Instance, Keyframe, Easing, TransformBuilder, createRenderer } from '../../dist/index.js';

    const canvas = document.getElementById('gpuCanvas');
    const engine = new Engine();
    const particleClip = new Clip('particle_spin')
      .duration(3000)
      .iterations(Infinity)
      .addKeyframe(new Keyframe(0).transform(new TransformBuilder().scale(1).build()))
      .addKeyframe(new Keyframe(3000).transform(new TransformBuilder().scale(2).build()));

    engine.addClip(particleClip);

    const instances = [];
    for (let i = 0; i < 100; i++) {
      instances.push(new Instance('particle_spin', `p_${i}`).delay(Math.random() * 3000));
    }
    engine.addInstances(instances);
    await engine.prepare();

    const renderer = await createRenderer(canvas);
    document.getElementById('status').innerText = `Active Renderer Backend: ${renderer.getBackendType()}`;

    let startTime = performance.now();
    function animate(time) {
      const frameTimeMs = time - startTime;
      renderer.render(engine, frameTimeMs);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
