name: Release & Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install dependencies
        run: pnpm install

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting root version to $VERSION from tag $GITHUB_REF_NAME"
          npm version "$VERSION" --no-git-tag-version

      - name: Build
        run: pnpm run build

      - name: Verify distributed packages
        run: |
          set -eux
          test -f packages/core/dist/index.js
          test -f packages/core/dist/index.d.ts
          test -f packages/core/dist/core.js
          test -f packages/core/dist/web.js
          test -f packages/core/dist/pkg/keyframe_engine_bg.wasm
          (cd packages/core && npm pack --dry-run --json) | grep -q "keyframe_engine_bg.wasm"
          test -f packages/core/dist/builder/index.js
          test -f packages/controller/dist/index.js
          test -f packages/three/dist/adapters/three_adapter.js
          test -f packages/webgpu/dist/adapters/webgpu_adapter.js
          test -f packages/webgpu/dist/generated/shaders.js
          test -f packages/dom/dist/index.js
          test -f packages/math/dist/index.js
          test -f packages/physics/dist/index.js
          test -f packages/sdf/dist/index.js

      - name: Test
        run: pnpm run test

      - name: Publish Monorepo
        run: pnpm run publish:monorepo
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
