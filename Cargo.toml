[package]
name = "keyframe-engine"
version = "0.1.0"
edition = "2021"
description = "WASM Keyframe Animation Engine with WGSL Math & Remotion Compatibility"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemWritableFileStream",
    "Window",
    "WorkerGlobalScope"
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
