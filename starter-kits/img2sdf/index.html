<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Keyframe Engine Starter Kit - img2SDF Procedural Reconstruction</title>
  <style>
    body {
      margin: 0;
      background: #0f111a;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    h1 { margin-top: 16px; font-size: 1.6rem; font-weight: 700; color: #38bdf8; }
    p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 12px; }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      max-w: 1000px;
      margin: 0 auto;
      padding: 0 10px;
    }
    .panel {
      background: #1e2230;
      border: 1px solid #2d3446;
      border-radius: 8px;
      padding: 16px;
      text-align: left;
    }
    .controls-panel { width: 320px; }
    .viewport-panel { flex: 1; min-width: 480px; }
    .dropzone {
      border: 2px dashed #38bdf8;
      border-radius: 6px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      background: #141824;
      transition: background 0.2s;
    }
    .dropzone:hover { background: #1a2032; }
    .dropzone img { max-width: 100%; max-height: 120px; margin-top: 10px; border-radius: 4px; display: none; }
    .preset-btns { display: flex; gap: 8px; margin: 10px 0; }
    button {
      flex: 1;
      padding: 8px 12px;
      cursor: pointer;
      background: #282e3f;
      color: #38bdf8;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover { background: #3b82f6; color: #fff; }
    .slider-group { margin-top: 12px; }
    .slider-group label { display: flex; justify-content: space-between; font-size: 0.85rem; color: #cbd5e1; }
    .slider-group input { width: 100%; margin-top: 4px; }
    #sdf-canvas { width: 100%; height: 420px; border-radius: 6px; background: #000; display: block; }
    #status { font-size: 0.85rem; color: #38bdf8; margin-top: 8px; font-mono: true; }
  </style>
</head>
<body>
  <h1>img2SDF Procedural CSG Reconstruction</h1>
  <p class="subtitle">Convert reference images/silhouettes into smooth SDF distance fields with Keyframe Engine motion</p>

  <div class="container">
    <div class="panel controls-panel">
      <h3>1. Reference Image</h3>
      <div id="dropzone" class="dropzone">
        <span id="drop-text">Click or Drop Image Here</span>
        <img id="preview-img" alt="Reference Preview" />
        <input type="file" id="file-input" accept="image/*" style="display: none;" />
      </div>

      <h4>Sample Targets</h4>
      <div class="preset-btns">
        <button id="preset-tree">Autumn Tree</button>
        <button id="preset-ship">Tower Ship</button>
        <button id="preset-piston">Piston</button>
      </div>

      <h3>2. SDF Parameters</h3>
      <div class="slider-group">
        <label>Smooth Blending (k) <span id="val-smooth">0.25</span></label>
        <input type="range" id="slider-smooth" min="0.0" max="0.8" step="0.01" value="0.25" />
      </div>
      <div class="slider-group">
        <label>Detail Resolution <span id="val-res">High</span></label>
        <input type="range" id="slider-res" min="1" max="3" step="1" value="3" />
      </div>

      <div style="margin-top: 16px;">
        <button id="btn-toggle-anim" style="width: 100%;">Toggle Animation Bridge (Active)</button>
      </div>
    </div>

    <div class="panel viewport-panel">
      <h3>3. Raymarched SDF Viewport</h3>
      <canvas id="sdf-canvas" width="640" height="420"></canvas>
      <div id="status">Initializing img2SDF Pipeline...</div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
